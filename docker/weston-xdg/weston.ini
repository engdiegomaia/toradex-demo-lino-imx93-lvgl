# Weston configuration for the LVGL GUI-Guider demo on Torizon / i.MX93.
#
# Goals:
#  - No visible desktop shell chrome (no panel, no launcher, no lock screen).
#  - Solid black background so the LVGL client owns every pixel that's not its
#    own drawing surface.
#  - Let the client run edge-to-edge; gui_guider creates a 1280x800 xdg-shell
#    toplevel and Weston will center it on the panel with black bars around
#    (real fullscreen is negotiated at the client side; this file only makes
#    sure nothing else fights for pixels).
#
# Path convention: torizon/weston-imx93 reads /etc/xdg/weston/weston.ini. We
# bind-mount this file over that path from docker-compose.

[core]
# Explicit backend keeps Weston from probing X11/Wayland fallbacks inside the
# container. drm-backend targets /dev/dri/card* on the i.MX93 DPU.
backend=drm-backend.so
idle-time=0
require-input=false

[shell]
locking=false
panel-position=none
background-color=0xff000000
animation=none
startup-animation=none
close-animation=none
# Force clients to be full window on a black surface. Prevents the Weston
# desktop background image and top panel from ever being drawn.
background-image=

[libinput]
enable-tap=true

[output]
# The KMS connector is LVDS-1, not DSI-1 — the pipeline is
# SoC MIPI DSI (4ae10000.dsi) -> SN65DSI83 bridge (i2c@2c) -> LVDS panel,
# and DRM names the connector after the last hop.
# Confirm on the target with:
#   for c in /sys/class/drm/card*-*/status; do echo "$c: $(cat $c)"; done
name=LVDS-1
# mode=preferred honours the panel EDID/DT timings (1024x600 for the Lino
# carrier). Do not force a mode — the DSI bridge negotiates it.
mode=preferred
