# Torizon deployment: Weston compositor + LVGL GUI-Guider app.
# The GUI-Guider binary is a Wayland client (see app/platform/linux/lv_conf.h
# LV_USE_WAYLAND=1); therefore a compositor must run alongside it.
#
# Bring up on the target with:
#   docker compose -f docker/docker-compose.yml up
#
# Rebuild only the app image after rebuilding the binary:
#   ./docker/build-aarch64.sh
#   docker compose -f docker/docker-compose.yml build lvgl-app     # cached layers reused
#   docker compose -f docker/docker-compose.yml up -d lvgl-app
#
# NOTE: do NOT pass --no-cache unless you actually want to invalidate every
# layer. Each service has a fixed `image:` tag (`:latest`) and a fixed
# `container_name`, so the same tag is overwritten in place and the container
# is recreated with the same identity — no image sprawl.
#
# Prerequisite: the aarch64 binary already built into
# app/platform/linux/build-aarch64-docker/gui_guider (via docker/build-aarch64.sh).
#
# Platform note (important):
#   The i.MX93 has no Vivante GPU. The correct compositor image is
#   `torizon/weston-imx93` (G2D/PXP path). Do NOT use `torizon/weston-vivante`
#   or the generic `torizon/weston` — they carry the Vivante userspace which
#   crash-loops on i.MX93 trying to open /dev/galcore.
#
#   Torizon OS 6 → tag major 3, Torizon OS 7 → tag major 4. This device runs
#   Torizon OS 7.7.0, hence :4.

services:
  # Torizon 7.7 can time out the first MediaMix block-controller probe before
  # its boot dependencies settle. A safe sysfs rebind creates /dev/dri/card0;
  # keeping this helper resident makes the recovery automatic after reboot.
  display-init:
    image: debian:bookworm-slim
    container_name: lino-display-init
    # This helper only writes the block-controller sysfs bind attribute. It
    # does not need device access or broad Linux capabilities.
    cap_drop:
      - ALL
    network_mode: none
    volumes:
      - /sys:/sys
      - /dev:/dev:ro
      - ./display-init.sh:/usr/local/bin/display-init.sh:ro
    command: /usr/local/bin/display-init.sh
    healthcheck:
      test: ["CMD-SHELL", "test -c /dev/dri/card0"]
      interval: 2s
      timeout: 1s
      retries: 45
      start_period: 2s
    restart: unless-stopped

  weston:
    image: torizon/weston-imx93:${TORIZON_TAG:-4}
    container_name: lino-weston
    environment:
      - ACCEPT_FSL_EULA=1
    # Weston clients use the shared Wayland socket under /tmp; no IP network
    # access is needed by the compositor.
    network_mode: none
    cap_add:
      - CAP_SYS_TTY_CONFIG
    volumes:
      - /dev:/dev
      - /tmp:/tmp
      - /run/udev/:/run/udev/:ro
      # Kiosk config: no panel, black background, no shell chrome.
      # Bind-mount the *directory*, not the file directly. The Torizon Weston
      # entrypoint runs dos2unix on weston.ini and does a rename(2) over it;
      # rename over a single bind-mounted file always fails with EBUSY,
      # regardless of ro/rw, because the kernel mounted that inode as the
      # mount point. A directory mount keeps the file as a regular dentry
      # inside a normal directory, so rename works.
      - ./weston-xdg:/etc/xdg/weston
      # The Torizon entrypoint honours `--developer` and switches its config
      # path to /etc/xdg/weston-dev/. Mount our file there too so the same
      # kiosk config applies regardless of which path Weston picks.
      - ./weston-xdg:/etc/xdg/weston-dev
    device_cgroup_rules:
      - "c 4:* rmw"     # /dev/tty*
      - "c 13:* rmw"    # /dev/input/*
      - "c 199:* rmw"   # /dev/watchdog*, misc
      - "c 226:* rmw"   # /dev/dri/*
      - "c 253:* rmw"   # dynamic misc majors (varies per kernel)
      - "c 10:223 rmw"  # /dev/uinput
    # Explicit empty CMD to override the image's default '--developer' flag,
    # which would switch config path to /etc/xdg/weston-dev/ AND re-enable
    # desktop-shell. We want production kiosk mode (kiosk-shell.so per our
    # weston.ini). The bind-mount to /etc/xdg/weston-dev covers the case where
    # the entrypoint forces --developer anyway.
    command: ""
    depends_on:
      display-init:
        condition: service_healthy
    restart: unless-stopped

  # Resident service: loads rt_latency_cm33.elf into the Cortex-M33 via
  # /sys/class/remoteproc/remoteproc0. Must complete before lvgl-app starts,
  # otherwise the shared-memory ring stays empty and the perf charts show
  # no data. It remains alive so Docker automatically runs it after reboot.
  m33-loader:
    build:
      context: ..
      dockerfile: docker/Dockerfile.m33-loader
    image: lino-imx93-m33-loader:latest
    container_name: lino-m33-loader
    privileged: true
    network_mode: none
    pid: host          # nsenter -t 1 -m to reach host mount namespace
    volumes:
      - /sys:/sys
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/m33-loader.ready"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 2s
    restart: unless-stopped

  lvgl-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    image: lino-imx93-lvgl-app:latest
    container_name: lino-lvgl-app
    network_mode: none
    depends_on:
      weston:
        condition: service_healthy
      m33-loader:
        condition: service_healthy
    environment:
      - XDG_RUNTIME_DIR=/tmp/1000-runtime-dir
      - WAYLAND_DISPLAY=wayland-0
      # Uncomment during handshake debugging to freeze state on first
      # boot_fail (no stop/start_multi_core_prog reboot loop).
      # - RT_NO_AUTORESTART=1
    # start.sh stages the selected firmware into the host's /lib/firmware
    # tmpfs via `nsenter -t 1 -m` — reaching the host mount namespace requires
    # pid: host. Without it, remoteproc's request_firmware_direct() can't find
    # any ELF but rt_latency_cm33.elf (the one m33-loader staged at boot).
    pid: host
    volumes:
      - /tmp:/tmp
      # The backend drives remoteproc by writing to sysfs (see
      # app/custom/script/start.sh). Needs /sys mounted rw and the sysfs
      # remoteproc nodes reachable from inside the container.
      - /sys:/sys
    # The GUI-Guider "Real-Time Edge" demo reads A55/M33 telemetry from
    # physical shared memory via /dev/mem + mmap (see
    # app/custom/real_time_edge/mem_mgr.c). Without this the CPU/latency
    # charts stay empty. CAP_SYS_RAWIO authorizes the mmap; the device
    # mapping exposes the node.
    devices:
      - /dev/mem:/dev/mem
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN   # needed to write /sys/.../remoteproc*/{firmware,state}
    # remoteproc firmware loading requires unrestricted access to sysfs;
    # SYS_ADMIN alone is not enough because the sysfs mount inherited from
    # host is read-only in the default seccomp profile.
    privileged: true
    restart: unless-stopped
